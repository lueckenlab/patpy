identifier: lueckenlab/patpy

name: patpy-mcp

description: >
  MCP server for sample-level single-cell dataset discovery. Searches and downloads
  datasets from CellxGene Discover by disease, tissue, assay, or ontology term, with
  a multi-source plugin architecture (HCA / GEO / Single Cell Portal coming).
  Designed to chain with MaxMLang/cxg-census-mcp for Census slice queries and
  biocontext-ai/anndata-mcp for AnnData inspection rather than duplicating them.

